name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests (>=95% coverage gate)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            */requirements.txt
            requirements-dev.txt
      - name: Install dependencies exactly as declared
        run: >
          pip install
          -r auth-service/requirements.txt -r expense-service/requirements.txt
          -r category-service/requirements.txt -r analytics-service/requirements.txt
          -r api-gateway/requirements.txt -r requirements-dev.txt
      - name: Run all suites (fails the build if any service is under 95% coverage)
        env:
          REDIS_TEST_URL: redis://localhost:6379/15
        run: ./run_tests.sh

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  stack-smoke:
    name: Full stack smoke test (docker compose)
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the whole stack (waits for healthchecks)
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Smoke test through the gateway
        run: CHECK_INTERNAL_PORTS_CLOSED=1 ./scripts/smoke_test.sh
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=100
      - name: Tear down
        if: always()
        run: docker compose down -v
