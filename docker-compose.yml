version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: bhavana
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bhavana -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    build: ./auth-service
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql://bhavana:postgres@postgres:5432/auth_db
      - SECRET_KEY=supersecretkey123
    depends_on:
      postgres:
        condition: service_healthy

  expense-service:
    build: ./expense-service
    ports:
      - "8002:8002"
    environment:
      - DATABASE_URL=postgresql://bhavana:postgres@postgres:5432/expense_db
      - AUTH_SERVICE_URL=http://auth-service:8001
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started

  category-service:
    build: ./category-service
    ports:
      - "8003:8003"
    environment:
      - DATABASE_URL=postgresql://bhavana:postgres@postgres:5432/category_db
      - AUTH_SERVICE_URL=http://auth-service:8001
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started

  analytics-service:
    build: ./analytics-service
    ports:
      - "8004:8004"
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8001
      - EXPENSE_SERVICE_URL=http://expense-service:8002
    depends_on:
      auth-service:
        condition: service_started
      expense-service:
        condition: service_started

  redis:
    image: redis:7-alpine
    container_name: expense_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api-gateway:
    build: ./api-gateway
    ports:
      - "8000:8000"
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8001
      - EXPENSE_SERVICE_URL=http://expense-service:8002
      - CATEGORY_SERVICE_URL=http://category-service:8003
      - ANALYTICS_SERVICE_URL=http://analytics-service:8004
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - auth-service
      - expense-service
      - category-service
      - analytics-service
      - redis

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - api-gateway

volumes:
  postgres_data:
