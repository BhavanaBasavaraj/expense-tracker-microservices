# Only the web dashboard (3000) and the API gateway (8000) are reachable from other
# machines. Internal services use `expose` (Docker-network only). Postgres and Redis are
# published on 127.0.0.1 purely for local debugging.
#
# Secrets come from .env (copy .env.example). The ${VAR:-default} fallbacks are for
# throwaway local development only: never deploy with them.

x-py-healthcheck: &py-healthcheck
  interval: 5s
  timeout: 3s
  retries: 12
  start_period: 10s

services:
  postgres:
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: bhavana
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: auth_db
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bhavana -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: expense_redis
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  auth-service:
    build: ./auth-service
    expose:
      - "8001"
    environment:
      - DATABASE_URL=postgresql://bhavana:${POSTGRES_PASSWORD:-postgres}@postgres:5432/auth_db
      - SECRET_KEY=${SECRET_KEY:-dev-only-secret-change-me}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      <<: *py-healthcheck

  expense-service:
    build: ./expense-service
    expose:
      - "8002"
    environment:
      - DATABASE_URL=postgresql://bhavana:${POSTGRES_PASSWORD:-postgres}@postgres:5432/expense_db
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-dev-only-internal-key-change-me}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      <<: *py-healthcheck

  category-service:
    build: ./category-service
    expose:
      - "8003"
    environment:
      - DATABASE_URL=postgresql://bhavana:${POSTGRES_PASSWORD:-postgres}@postgres:5432/category_db
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-dev-only-internal-key-change-me}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      <<: *py-healthcheck

  analytics-service:
    build: ./analytics-service
    expose:
      - "8004"
    environment:
      - EXPENSE_SERVICE_URL=http://expense-service:8002
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-dev-only-internal-key-change-me}
    depends_on:
      expense-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"]
      <<: *py-healthcheck

  api-gateway:
    build: ./api-gateway
    ports:
      - "8000:8000"
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8001
      - EXPENSE_SERVICE_URL=http://expense-service:8002
      - CATEGORY_SERVICE_URL=http://category-service:8003
      - ANALYTICS_SERVICE_URL=http://analytics-service:8004
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-dev-only-secret-change-me}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-dev-only-internal-key-change-me}
    depends_on:
      auth-service:
        condition: service_healthy
      expense-service:
        condition: service_healthy
      category-service:
        condition: service_healthy
      analytics-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      <<: *py-healthcheck

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - api-gateway

volumes:
  postgres_data:
